naftiko: 1.0.0-alpha2
info:
  label: AWS Braket Tags API — Tags
  description: 'AWS Braket Tags API — Tags. 3 operations. Lead operation: AWS Braket List Tags For Resource. Tagging
    capability for cost allocation, IAM ABAC, and resource organization across quantum tasks, hybrid jobs, and
    spending limits.'
  tags:
  - AWS Braket
  - Quantum
  - Tags
  - FinOps
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: tags
    baseUri: https://braket.{{env.AWS_REGION}}.amazonaws.com
    description: AWS Braket Tags API business capability.
    resources:
    - name: tags-by-resource
      path: /tags/{resourceArn}
      operations:
      - name: listtagsforresource
        method: GET
        description: AWS Braket List Tags For Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceArn
          in: path
          type: string
          required: true
      - name: tagresource
        method: POST
        description: AWS Braket Tag A Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceArn
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
      - name: untagresource
        method: DELETE
        description: AWS Braket Untag A Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceArn
          in: path
          type: string
          required: true
        - name: tagKeys
          in: query
          type: array
          required: true
    authentication:
      type: awssigv4
      region: '{{env.AWS_REGION}}'
      service: braket
      accessKeyId: '{{env.AWS_ACCESS_KEY_ID}}'
      secretAccessKey: '{{env.AWS_SECRET_ACCESS_KEY}}'
  exposes:
  - type: mcp
    namespace: tags-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS Braket Tags.
    tools:
    - name: aws-braket-list-tags-for-resource
      description: AWS Braket List Tags For Resource
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tags.listtagsforresource
      with:
        resourceArn: tools.resourceArn
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-tag-resource
      description: AWS Braket Tag A Resource
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: tags.tagresource
      with:
        resourceArn: tools.resourceArn
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-untag-resource
      description: AWS Braket Untag A Resource
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: tags.untagresource
      with:
        resourceArn: tools.resourceArn
        tagKeys: tools.tagKeys
      outputParameters:
      - type: object
        mapping: $.
