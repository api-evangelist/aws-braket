naftiko: 1.0.0-alpha2
info:
  label: AWS Braket Quantum Tasks API — Quantum Tasks
  description: 'AWS Braket Quantum Tasks API — Quantum Tasks. 4 operations. Lead operation: AWS Braket Create A Quantum
    Task. Self-contained Naftiko capability covering Braket quantum task submission, retrieval, search, and
    cancellation.'
  tags:
  - AWS Braket
  - Quantum
  - Quantum Tasks
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: quantum-tasks
    baseUri: https://braket.{{env.AWS_REGION}}.amazonaws.com
    description: AWS Braket Quantum Tasks API business capability. Self-contained, no shared references.
    resources:
    - name: quantum-task
      path: /quantum-task
      operations:
      - name: createquantumtask
        method: POST
        description: AWS Braket Create A Quantum Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: quantum-task-by-arn
      path: /quantum-task/{quantumTaskArn}
      operations:
      - name: getquantumtask
        method: GET
        description: AWS Braket Get A Quantum Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: quantumTaskArn
          in: path
          type: string
          required: true
    - name: quantum-task-cancel
      path: /quantum-task/{quantumTaskArn}/cancel
      operations:
      - name: cancelquantumtask
        method: PUT
        description: AWS Braket Cancel A Quantum Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: quantumTaskArn
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          required: true
    - name: quantum-tasks
      path: /quantum-tasks
      operations:
      - name: searchquantumtasks
        method: POST
        description: AWS Braket Search Quantum Tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: awssigv4
      region: '{{env.AWS_REGION}}'
      service: braket
      accessKeyId: '{{env.AWS_ACCESS_KEY_ID}}'
      secretAccessKey: '{{env.AWS_SECRET_ACCESS_KEY}}'
  exposes:
  - type: rest
    namespace: quantum-tasks-rest
    port: 8080
    description: REST adapter for AWS Braket Quantum Tasks. One Spectral-compliant resource per consumed operation.
    resources:
    - path: /v1/quantum-tasks
      name: quantum-tasks
      description: REST surface for quantum-task creation and search.
      operations:
      - method: POST
        name: createquantumtask
        description: AWS Braket Create A Quantum Task
        call: quantum-tasks.createquantumtask
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: searchquantumtasks
        description: AWS Braket Search Quantum Tasks
        call: quantum-tasks.searchquantumtasks
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/quantum-tasks/{quantumTaskArn}
      name: quantum-task-by-arn
      description: REST surface for a single quantum task.
      operations:
      - method: GET
        name: getquantumtask
        description: AWS Braket Get A Quantum Task
        call: quantum-tasks.getquantumtask
        with:
          quantumTaskArn: rest.path.quantumTaskArn
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/quantum-tasks/{quantumTaskArn}/cancel
      name: quantum-task-cancel
      description: REST surface for cancelling a quantum task.
      operations:
      - method: PUT
        name: cancelquantumtask
        description: AWS Braket Cancel A Quantum Task
        call: quantum-tasks.cancelquantumtask
        with:
          quantumTaskArn: rest.path.quantumTaskArn
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: quantum-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS Braket Quantum Tasks. One tool per consumed operation.
    tools:
    - name: aws-braket-create-quantum-task
      description: AWS Braket Create A Quantum Task
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: quantum-tasks.createquantumtask
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-get-quantum-task
      description: AWS Braket Get A Quantum Task
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-tasks.getquantumtask
      with:
        quantumTaskArn: tools.quantumTaskArn
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-cancel-quantum-task
      description: AWS Braket Cancel A Quantum Task
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: quantum-tasks.cancelquantumtask
      with:
        quantumTaskArn: tools.quantumTaskArn
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-search-quantum-tasks
      description: AWS Braket Search Quantum Tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: quantum-tasks.searchquantumtasks
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
