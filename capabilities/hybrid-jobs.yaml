naftiko: 1.0.0-alpha2
info:
  label: AWS Braket Hybrid Jobs API — Hybrid Jobs
  description: 'AWS Braket Hybrid Jobs API — Hybrid Jobs. 4 operations. Lead operation: AWS Braket Create A Hybrid
    Job. Self-contained Naftiko capability for orchestrating hybrid quantum-classical algorithms (VQE, QAOA, QML)
    using container-based execution against priority QPU access.'
  tags:
  - AWS Braket
  - Quantum
  - Hybrid Jobs
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: hybrid-jobs
    baseUri: https://braket.{{env.AWS_REGION}}.amazonaws.com
    description: AWS Braket Hybrid Jobs API business capability.
    resources:
    - name: job
      path: /job
      operations:
      - name: createjob
        method: POST
        description: AWS Braket Create A Hybrid Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: job-by-arn
      path: /job/{jobArn}
      operations:
      - name: getjob
        method: GET
        description: AWS Braket Get A Hybrid Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobArn
          in: path
          type: string
          required: true
    - name: job-cancel
      path: /job/{jobArn}/cancel
      operations:
      - name: canceljob
        method: PUT
        description: AWS Braket Cancel A Hybrid Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobArn
          in: path
          type: string
          required: true
    - name: jobs
      path: /jobs
      operations:
      - name: searchjobs
        method: POST
        description: AWS Braket Search Hybrid Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: awssigv4
      region: '{{env.AWS_REGION}}'
      service: braket
      accessKeyId: '{{env.AWS_ACCESS_KEY_ID}}'
      secretAccessKey: '{{env.AWS_SECRET_ACCESS_KEY}}'
  exposes:
  - type: rest
    namespace: hybrid-jobs-rest
    port: 8080
    description: REST adapter for AWS Braket Hybrid Jobs.
    resources:
    - path: /v1/jobs
      name: jobs
      description: REST surface for hybrid job creation and search.
      operations:
      - method: POST
        name: createjob
        description: AWS Braket Create A Hybrid Job
        call: hybrid-jobs.createjob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: searchjobs
        description: AWS Braket Search Hybrid Jobs
        call: hybrid-jobs.searchjobs
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{jobArn}
      name: job-by-arn
      description: REST surface for a single hybrid job.
      operations:
      - method: GET
        name: getjob
        description: AWS Braket Get A Hybrid Job
        call: hybrid-jobs.getjob
        with:
          jobArn: rest.path.jobArn
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/jobs/{jobArn}/cancel
      name: job-cancel
      description: REST surface for cancelling a hybrid job.
      operations:
      - method: PUT
        name: canceljob
        description: AWS Braket Cancel A Hybrid Job
        call: hybrid-jobs.canceljob
        with:
          jobArn: rest.path.jobArn
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hybrid-jobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for AWS Braket Hybrid Jobs.
    tools:
    - name: aws-braket-create-job
      description: AWS Braket Create A Hybrid Job
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: hybrid-jobs.createjob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-get-job
      description: AWS Braket Get A Hybrid Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hybrid-jobs.getjob
      with:
        jobArn: tools.jobArn
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-cancel-job
      description: AWS Braket Cancel A Hybrid Job
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: hybrid-jobs.canceljob
      with:
        jobArn: tools.jobArn
      outputParameters:
      - type: object
        mapping: $.
    - name: aws-braket-search-jobs
      description: AWS Braket Search Hybrid Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hybrid-jobs.searchjobs
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
