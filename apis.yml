position: Consuming
description: >-
  Amazon Braket is AWS's fully managed quantum computing service. It provides a unified API and SDK for exploring,
  designing, simulating, and running quantum algorithms across a single point of access to multiple third-party QPU
  technologies (trapped-ion, superconducting, neutral-atom) and AWS-managed cloud simulators. Braket handles device
  queueing, S3-backed result delivery, IAM, hybrid quantum-classical job orchestration, Braket Direct reservations, and
  opt-in spending limits, with native PennyLane, Qiskit, and OpenQASM 3 support.
